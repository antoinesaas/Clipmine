# ClipMine video worker — déployer avec : fly deploy (depuis worker/)
app = "clipmine-worker"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "2048mb"
  cpu_kind = "shared"
  cpus = 2
